name: build-setup ubuntu 26.04

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number

permissions:
  contents: read

defaults:
  run:
    shell: bash -leo pipefail {0}

jobs:
  build-setup-ubuntu-2604:
    name: build-setup ubuntu 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    env:
      PIXI_HOME: ${{ github.workspace }}/.ci/pixi
      FORCE_NON_EC2: 1
      JVM_OPTS: -Xmx3200m
    steps:
      - name: Maximize build space
        uses: jimfangx/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 10240
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh pull request merge ref
        run: |
          git fetch --no-tags origin "pull/${{ inputs.pr_number }}/merge"
          git checkout --detach FETCH_HEAD
          git rev-parse --short HEAD

      - name: Install Pixi
        run: |
          ./scripts/install-pixi.sh
          echo "$PIXI_HOME/bin" >> "$GITHUB_PATH"

      - name: Exclude CI-managed directories from ctags
        run: |
          grep -qxF ".ci" .ctagsignore || printf "\n.ci\n" >> .ctagsignore

      - name: Run build setup
        run: |
          git config --global --add safe.directory "*"
          ./build-setup.sh riscv-tools
          grep -F "Setup complete!" build-setup.log
