channels:
    - ucb-bar
    - conda-forge
    - litex-hub
    - nodefaults

platforms:
    - linux-64
    - osx-arm64 # allow editing of docs locally on MacOS

dependencies:
    # https://conda-forge.org/feedstock-outputs/
    #   filterable list of all conda-forge packages
    # https://conda-forge.org/#contribute
    #   instructions on adding a recipe
    # https://docs.conda.io/projects/conda/en/latest/user-guide/concepts/pkg-specs.html#package-match-specifications
    #   documentation on package_spec syntax for constraining versions

    # doc requirements
    - sphinx
    - pygments
    - sphinx-autobuild
    - sphinx_rtd_theme
    - docutils
    - requests

    # Install Node.js outside conda to avoid conflicting with the ICU version
    # required by Chipyard's toolchain. fnm reads docs/.nvmrc and installs an
    # official Node.js binary that does not use conda's ICU package.
    - fnm
