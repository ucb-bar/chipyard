[workspace]
name = "chipyard"
channels = ["ucb-bar", "conda-forge", "litex-hub"]
# "linux64" is linux-64 with the glibc floor declared inline (needs a name distinct from the subdir)
platforms = [{ name = "linux64", platform = "linux-64", glibc = "2.34" }, "osx-arm64"]

# ---- formerly conda-reqs/chipyard-base.yaml ----
[feature.base]
platforms = ["linux64"]

[feature.base.dependencies]
gcc = "13.2.*"
gxx = "13.2.*"
sysroot_linux-64 = "==2.34" # need to be close to system glibc for VCS compatibility
conda-gcc-specs = "*"
binutils = "*"

# misc
autoconf = "*"
coreutils = "*"
jq = "*"
pip = "*"
make = "*"
git = "*"
ninja = "*" # needed in case we need to build circt from scratch
libnuma = "*" # added to prevent libnuma.so.1 not found err on systems without it
numactl = "*" # same as above

sbt = "*"
openjdk = "20.*"
dtc = "*"
verilator = "==5.022"

# ---- formerly conda-reqs/riscv-tools.yaml ----
[feature.riscv-tools]
platforms = ["linux64"]

[feature.riscv-tools.dependencies]
riscv-tools = "==1.0.6" # from ucb-bar channel - https://github.com/ucb-bar/riscv-tools-feedstock

# ---- formerly conda-reqs/chipyard-extended.yaml ----
[feature.extended]
platforms = ["linux64"]

[feature.extended.dependencies]
# bundle FireSim driver with deps into installer shell-script
constructor = "*"

# misc
readline = "*"

# firemarshal deps
qemu = "*" # from ucb-bar channel - https://github.com/ucb-bar/qemu-feedstock
rsync = "*"
psutil = "*"
doit = ">=0.34.0"
gitpython = "*"
humanfriendly = "*"
ctags = "*"
bison = "*"
flex = "*"
expat = "*"
python = ">=3.9,<3.11"
bc = "*"
unzip = "*"
patch = "*"
which = { version = "==2.21", build = "h0b41bf4_1" }
sed = "*"
diffutils = "*"
bash = "*"
gzip = "*"
bzip2 = "*"
perl = "*"
tar = "*"
file = "*"
wget = "*"
findutils = "*"
lzop = "*"

bash-completion = "*"
ca-certificates = "*"
mosh = "*"
gmp = "*"
mpfr = "*"
mpc = "*"
zlib = "*"
vim = "*"
gengetopt = "*"
libffi = "*"
libusb1 = "*"
ncurses = "*"
cmake = "*"
graphviz = "*"
expect = "*"

# zephyr deps
gperf = "*"
ccache = "*"
west = "*"
pyelftools = "*"

# clang-format for driver coding style enforcement.
clang-format = "*"
clang-tools = "*"

# hammer packages
sty = "*"
"ruamel.yaml" = ">=0.17.21,<0.18" # constrain conda's copy to what hammer-vlsi 1.2.0 accepts
pydantic = ">=1.9.2,<2.0.0" # same

# firesim python packages (kept as conda packages to match previous env)
screen = "*"
elfutils = "*"
libdwarf-dev = "==0.0.0.20190110_28_ga81397fc4" # from ucb-bar channel - using mainline libdwarf-feedstock
colorama = "*"
argcomplete = "*"
python-graphviz = "*"
pyparsing = "*"
numpy = ">=1.23.0,<2.0.0" # constrained to what hammer-vlsi 1.2.0 accepts
kiwisolver = "*"
matplotlib-base = "*"
pandas = "*"
awscli = "*"
pytest = "*"
pytest-dependency = "*"
pytest-mock = "*"
moto = "*"
mypy = "*"
s3fs = "==0.4.2"
aiohttp = "*"

# firesim ci shared packages
boto3 = "*"
boto3-stubs = "*"
mypy-boto3-s3 = "*"
mypy_boto3_ec2 = "*"
botocore-stubs = "*"
cryptography = "<41"
pytz = "*"
types-pytz = "*"
pyyaml = "*"
types-pyyaml = "*"
requests = "*"
types-requests = "*"
azure-identity = "*"
fsspec = "*"

[feature.extended.pypi-dependencies]
hammer-vlsi = { version = "==1.2.0", extras = ["asap7"] }
sure = "*"
pylddwrap = "*"
fab-classic = ">=1.19.2"
bcrypt = "<4.0.0"

# ---- formerly conda-reqs/docs.yaml ----
[feature.docs]
platforms = ["linux64", "osx-arm64"] # allow editing of docs locally on MacOS

[feature.docs.dependencies]
sphinx = "*"
pygments = "*"
sphinx-autobuild = "*"
sphinx_rtd_theme = "*"
docutils = "*"

[environments]
default = { features = ["base", "extended", "riscv-tools", "docs"], solve-group = "main" }
lean = { features = ["base", "riscv-tools", "docs"], solve-group = "main" }
docs = { features = ["docs"] }
